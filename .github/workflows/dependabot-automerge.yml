name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      # There is deliberately no "gh pr review --approve" step here: GITHUB_TOKEN
      # must not be able to approve pull requests (SEC §9.2, ORG-WORKFLOW-PR-APPROVAL),
      # and the org has "Allow GitHub Actions to create and approve pull requests"
      # disabled. Auto-merge is queued below and fires once a human approves.
      # Please do not re-add an approval step.
      - name: Enable auto-merge
        run: |
          gh pr merge \
            --squash \
            --auto \
            "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
