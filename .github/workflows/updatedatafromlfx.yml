name: Update Data From LFX
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # The action commits the refreshed charters and opens a pull request for it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: jmertic/lfx-tac-actions@13097c41322c4d3b77ff202c67eb4de5e1a9439b # 20261123
        with:
          updateprojects: false
          updatetacmembers: false
          updatetacagendaitems: false
          updateclomonitor: false
          updatedecks: false
          updatecharters: true
          slug: neonephos-foundation
        env:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
